name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck deploy/scripts/*.sh deploy/scripts/tests/*.sh
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -c .github/linters/.yamllint deploy/docker-compose.yml
      - name: Validate docker-compose
        run: cd deploy && docker compose config
